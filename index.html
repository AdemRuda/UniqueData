<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Permit end Date</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="form-container">
    <h1>Unique Permit end Date</h1>

    <form id="employeeForm" action="submit.php" method="POST">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname" required>
      </div>
      <div class="form-group">
        <label for="start_date">Start Date:</label>
        <input type="date" id="start_date" name="start_date" required>
      </div>
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="work_date">Work Date:</label>
        <input type="date" id="work_date" name="work_date" required>
      </div>
      <div class="form-group">
        <label for="visa_start">Visa Start:</label>
        <input type="date" id="visa_start" name="visa_start" required>
      </div>
      <div class="form-group">
        <label for="visa_end">Visa End:</label>
        <input type="date" id="visa_end" name="visa_end" required>
      </div>
      <div class="form-group">
        <label for="work_place">Work Place:</label>
        <input type="text" id="work_place" name="work_place" required>
      </div>
      <div class="form-group">
        <label for="atesia">Atesia:</label>
        <input type="text" id="atesia" name="atesia" required>
      </div>
      <div class="form-group">
        <label for="amesia">Amesia:</label>
        <input type="text" id="amesia" name="amesia" required>
      </div>
      <div class="form-group">
        <label for="data_e_lindjes">Data e Lindjes:</label>
        <input type="date" id="data_e_lindjes" name="data_e_lindjes" required>
      </div>
      <div class="form-group">
        <label for="numri_i_pashaportes">Numri i Pashaportes:</label>
        <input type="text" id="numri_i_pashaportes" name="numri_i_pashaportes" required>
      </div>
      <div class="form-group">
        <label for="vlefshmeria_e_pashaportes">Vlefshmeria e Pashaportes:</label>
        <input type="date" id="vlefshmeria_e_pashaportes" name="vlefshmeria_e_pashaportes" required>
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
